version: 2

project_name: file-mapper

builds:
  - id: file-mapper
    main: ./main.go
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{.Version}}

brews:
  - repository:
      owner: sky93
      name: homebrew-tap
    directory: Formula
    name: file-mapper
    license: MIT
    homepage: "https://github.com/sky93/file-mapper"
    description: "Combines tree and cat in one CLI for recursive project mapping and file content viewing"
    install: |
      bin.install "file-mapper"

nfpms:
  - id: default
    package_name: "file-mapper"

    formats:
      - deb
      - rpm
      - apk

    maintainer: "Sepehr Mohaghegh <sepehr.mohaghegh@hotmail.com>"
    vendor: "sky93"
    homepage: "https://github.com/sky93/file-mapper"
    description: "file-mapper: Combines tree and cat in one CLI for recursive project mapping and file content viewing."
    license: "MIT"
    bindir: "/usr/bin"
